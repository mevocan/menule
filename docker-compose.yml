services:
  app:
    build: ./docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  queue:
    build: ./docker/php
    command: php artisan queue:work --tries=1 --timeout=600
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: qr
      POSTGRES_USER: qr
      POSTGRES_PASSWORD: qr_local
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
